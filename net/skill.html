<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerNet - Creative Skills</title>

<style>
body {
  background: linear-gradient(135deg, #0b1a2f, #0f2a4d);
  font-family: 'Poppins', sans-serif;
  color: white;
  text-align: center;
  padding: 20px;
}

.container {
  max-width: 1000px;
  margin: auto;
}

h2 {
  margin-bottom: 10px;
}

p {
  color: #cbd5e1;
}

/* Cards */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  margin: 30px 0;
}

.card {
  background: rgba(255,255,255,0.05);
  padding: 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
  background: rgba(255,255,255,0.08);
}

/* Details Box */
.details-box {
  margin-top: 20px;
  background: rgba(255,255,255,0.05);
  padding: 20px;
  border-radius: 12px;
  text-align: left;
}

.details-box h3 {
  margin-bottom: 10px;
}

ul {
  margin-left: 20px;
  color: #94a3b8;
}

@media(max-width:600px){
  h2 { font-size: 22px; }
}
</style>
</head>

<body>

<div class="container">

<h2>🎨 Creative Skills</h2>
<p>Explore your creativity and turn your passion into a career</p>

<!-- Skill Cards -->
<div class="grid">
  <div class="card" onclick="showDetails('photo')">📸 Photography</div>
  <div class="card" onclick="showDetails('video')">🎬 Videography</div>
  <div class="card" onclick="showDetails('fashion')">👗 Fashion Design</div>
  <div class="card" onclick="showDetails('graphic')">🖌️ Graphic Design</div>
</div>

<!-- Dynamic Details -->
<div id="details" class="details-box" style="display:none;"></div>

</div>

<script>
const data = {
  photo: {
    title: "📸 Photography",
    content: `
      <p><b>What you learn:</b></p>
      <ul>
        <li>Camera basics & lighting</li>
        <li>Composition techniques</li>
        <li>Photo editing</li>
      </ul>

      <p><b>Tools:</b> DSLR, Lightroom, Photoshop</p>

      <p><b>Career Options:</b> Photographer, Photo Editor, Freelancer</p>
    `
  },

  video: {
    title: "🎬 Videography",
    content: `
      <ul>
        <li>Camera handling & shooting</li>
        <li>Video editing</li>
        <li>Storytelling</li>
      </ul>

      <p><b>Tools:</b> Premiere Pro, After Effects</p>

      <p><b>Careers:</b> Video Editor, YouTuber, Filmmaker</p>
    `
  },

  fashion: {
    title: "👗 Fashion Design",
    content: `
      <ul>
        <li>Sketching & styling</li>
        <li>Fabric knowledge</li>
        <li>Trend analysis</li>
      </ul>

      <p><b>Tools:</b> Adobe Illustrator, Sewing tools</p>

      <p><b>Careers:</b> Fashion Designer, Stylist, Brand Owner</p>
    `
  },

  graphic: {
    title: "🖌️ Graphic Design",
    content: `
      <ul>
        <li>Typography & color theory</li>
        <li>Logo & branding design</li>
        <li>UI basics</li>
      </ul>

      <p><b>Tools:</b> Photoshop, Figma, Canva</p>

      <p><b>Careers:</b> Designer, Freelancer, UI/UX Designer</p>
    `
  }
};

function showDetails(skill) {
  const box = document.getElementById("details");
  box.style.display = "block";
  box.innerHTML = `
    <h3>${data[skill].title}</h3>
    ${data[skill].content}
  `;
}
</script>

</body>
</html>
