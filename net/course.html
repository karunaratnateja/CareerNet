<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerNet - Smart Roadmap</title>

<style>
body {
  background: linear-gradient(135deg, #0b1a2f, #0f2a4d);
  font-family: 'Poppins', sans-serif;
  color: white;
  text-align: center;
  padding: 20px;
}

.container {
  max-width: 1000px;
  margin: auto;
}

h2 {
  margin-bottom: 10px;
}

select {
  padding: 10px;
  margin: 10px;
  border-radius: 8px;
  border: none;
}

.roadmap {
  margin-top: 20px;
  display: grid;
  gap: 15px;
}

.step {
  background: rgba(255,255,255,0.05);
  padding: 15px;
  border-radius: 10px;
  text-align: left;
  cursor: pointer;
}

.step:hover {
  background: rgba(255,255,255,0.08);
}

.details {
  display: none;
  color: #94a3b8;
  margin-top: 8px;
}

.active .details {
  display: block;
}

#sector{
  background: linear-gradient(90deg, #dc6abb, #68a2dc);
  font-size: 15px;
}

#career{
    background: linear-gradient(90deg, #dc6abb, #68a2dc);
 font-size: 15px;
}



</style>
</head>

<body>

<div class="container">

<h2>📘 Smart Career Roadmap</h2>
<p>Select your sector and career to see the roadmap</p>

<!-- Sector -->
<select id="sector" onchange="loadCareers()">
  <option value="">-- Select Sector --</option>
  <option value="tech">Technology</option>
  <option value="medical">Medical</option>
  <option value="creative">Creative</option>
  <option value="business">Business</option>
  <option value="government">Government Jobs</option>
  <option value="engineering">Engineering</option>
</select>

<!-- Career -->
<select id="career" onchange="showRoadmap()">
  <option value="">-- Select Career --</option>
</select>

<!-- Roadmap -->
<div id="roadmap" class="roadmap"></div>

</div>

<script>

const data = {
  tech: {
    "Software Developer": [
      ["Learn Basics", "HTML, CSS, JS"],
      ["Programming", "Python/Java"],
      ["Frameworks", "React, Node"],
      ["Projects", "Build apps"],
      ["Job Ready", "DSA + Interviews"]
    ],
    "Data Scientist": [
      ["Math Basics", "Statistics, Probability"],
      ["Programming", "Python"],
      ["Libraries", "Pandas, NumPy"],
      ["ML", "Machine Learning"],
      ["Projects", "Real datasets"]
    ],
    "Cyber Security": [
      ["Networking", "Basics"],
      ["Linux", "System knowledge"],
      ["Security Tools", "Kali Linux"],
      ["Ethical Hacking", "Concepts"],
      ["Certifications", "CEH"]
    ]
  },

  medical: {
    "Doctor": [
      ["School", "Biology stream"],
      ["Entrance", "NEET"],
      ["Degree", "MBBS"],
      ["Internship", "Hospital"],
      ["Specialization", "MD/MS"]
    ],
    "Pharmacist": [
      ["Science", "Biology"],
      ["Degree", "B.Pharm"],
      ["Training", "Pharma companies"],
      ["License", "Certification"],
      ["Career", "Hospital/Industry"]
    ]
  },

  creative: {
    "Photographer": [
      ["Basics", "Camera knowledge"],
      ["Practice", "Photoshoots"],
      ["Editing", "Lightroom"],
      ["Portfolio", "Build work"],
      ["Freelance", "Clients"]
    ],
    "Video Editor": [
      ["Basics", "Editing principles"],
      ["Tools", "Premiere Pro"],
      ["Practice", "Edit videos"],
      ["Portfolio", "Showcase work"],
      ["Jobs", "Freelance/Agency"]
    ],
    "Fashion Designer": [
      ["Design Basics", "Sketching"],
      ["Course", "Fashion degree"],
      ["Skills", "Fabric knowledge"],
      ["Portfolio", "Design collection"],
      ["Career", "Brand/Designer"]
    ]
  },

  business: {
    "Entrepreneur": [
      ["Idea", "Business concept"],
      ["Planning", "Business model"],
      ["Skills", "Marketing"],
      ["Launch", "Start small"],
      ["Scale", "Grow business"]
    ],
    "MBA Professional": [
      ["Degree", "BBA/BCom"],
      ["Entrance", "CAT"],
      ["MBA", "Specialization"],
      ["Internship", "Corporate"],
      ["Job", "Manager roles"]
    ]
  },

  government: {
    "IAS": [
      ["Degree", "Any graduation"],
      ["Preparation", "UPSC syllabus"],
      ["Prelims", "Exam"],
      ["Mains", "Exam"],
      ["Interview", "Final stage"]
    ],
    "SSC Jobs": [
      ["Eligibility", "Graduation"],
      ["Preparation", "Quant, Reasoning"],
      ["Exam", "SSC"],
      ["Skill Test", "If required"],
      ["Job", "Government role"]
    ]
  },

  engineering: {
    "Mechanical Engineer": [
      ["School", "PCM"],
      ["Entrance", "JEE"],
      ["Degree", "B.Tech"],
      ["Internship", "Industry"],
      ["Job", "Core companies"]
    ],
    "Civil Engineer": [
      ["School", "PCM"],
      ["Entrance", "JEE"],
      ["Degree", "B.Tech Civil"],
      ["Training", "Site work"],
      ["Job", "Construction firms"]
    ]
  }
};

function loadCareers() {
  const sector = document.getElementById("sector").value;
  const careerSelect = document.getElementById("career");

  careerSelect.innerHTML = '<option value="">-- Select Career --</option>';

  if (!sector) return;

  Object.keys(data[sector]).forEach(career => {
    let option = document.createElement("option");
    option.value = career;
    option.textContent = career;
    careerSelect.appendChild(option);
  });

  document.getElementById("roadmap").innerHTML = "";
}

function showRoadmap() {
  const sector = document.getElementById("sector").value;
  const career = document.getElementById("career").value;
  const container = document.getElementById("roadmap");

  container.innerHTML = "";

  if (!career) return;

  data[sector][career].forEach(step => {
    let div = document.createElement("div");
    div.classList.add("step");

    div.innerHTML = `
      <b>${step[0]}</b>
      <div class="details">${step[1]}</div>
    `;

    div.onclick = () => div.classList.toggle("active");

    container.appendChild(div);
  });
}

</script>

</body>
</html>
